name: Sync Google Sheet Data

on:
  schedule:
    # Runs every 2 hours on weekdays during school hours (07:00 - 17:00 Thailand time / UTC+7)
    - cron: '0 0,2,4,6,8,10 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger in GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openpyxl

      - name: Run sync script
        run: |
          python sync_attendance.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes detected from Google Sheet."
          else
            git commit -m "Auto-sync attendance data from Google Sheet [skip ci]"
            git push origin main
          fi
